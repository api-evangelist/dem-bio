name: DEM Bio
description: 'DEM BioPharma is a Cambridge, Massachusetts biotechnology company developing first-in-class
  cancer therapeutics that target the signals solid tumors use to evade immune destruction. The company
  pioneers next-generation macrophage and innate-immune immunotherapies discovered through its proprietary
  CHoMP (Co-culture with Human Myeloid Phagocytes) functional-genomics platform, which uses CRISPR-based
  screening to identify novel "don''t-eat-me" and activating targets on myeloid cells. DEM launched in
  2022 with $70M in Series A financing and is backed by Longwood Fund, Emerson Collective, Pfizer Ventures,
  Astellas, and Insight Partners. Added to the API Evangelist network as a portfolio-company profile; DEM
  publishes no public developer or API surface at this time.'
